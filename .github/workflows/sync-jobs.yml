name: Retrieve Tune jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: tune-job-retrieval
  cancel-in-progress: false

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch Tune job listings
        run: |
          curl --fail-with-body --location --compressed \
            --connect-timeout 10 \
            --max-time 30 \
            --user-agent "Mozilla/5.0" \
            --output tune-jobs.html \
            --write-out '\nHTTP status: %{http_code}\nFinal URL: %{url_effective}\n' \
            "https://www.linkedin.com/jobs/search/?f_C=95722057"

      - name: Generate jobs JSON
        run: node scripts/sync-jobs.mjs

      - name: Save jobs JSON
        uses: actions/upload-artifact@v4
        with:
          name: tune-jobs
          path: output/jobs.json
          if-no-files-found: error
          retention-days: 7

      - name: Save response for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-response
          path: tune-jobs.html
          if-no-files-found: ignore
          retention-days: 3
